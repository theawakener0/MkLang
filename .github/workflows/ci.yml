name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -composites=false ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Smoke test generated language
        run: |
          set -euo pipefail
          go run . generate -config examples/configs/pythonish.json -out /tmp/pysh
          (cd /tmp/pysh && go build -o py . && ./py "$GITHUB_WORKSPACE/examples/demo.pysh")
